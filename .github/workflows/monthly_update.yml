name: Monthly Vocabulary Update

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-words:
    runs-on: ubuntu-latest

    # Tell GitHub Actions to run commands inside the vocab-widget subfolder
    defaults:
      run:
        working-directory: vocab-widget

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wn

      - name: Run Update Script
        run: python update_words.py

      - name: Commit and Push Updated words.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add words.json
          git commit -m "Auto-update words.json for the new month" || exit 0
          git push